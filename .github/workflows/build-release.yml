name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK
        uses: ralfirza/apk-signer@v1
        with:
          apk-file: android/app/build/outputs/apk/release/app-release-unsigned.apk
        continue-on-error: true

      - name: Rename & Prepare Artifacts
        run: |
          mkdir -p artifacts
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/Zapdrop-v1.0-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/Zapdrop-v1.0-release.apk
          fi
          cd artifacts && sha256sum Zapdrop-v1.0-release.apk > Zapdrop-v1.0-release.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapdrop-v1.0-release-apk
          path: artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Zapdrop v1.0.0 (Android 5.1+ / API 22+)"
          body: |
            ## Zapdrop v1.0.0 Release
            
            - **Target Platform**: Android 5.1+ (API Level 22 through API 34+)
            - **Framework**: Capacitor 6.2 + React + Vite + Tailwind CSS
            - **Features**:
              - High-speed offline P2P transfer (NanoHTTPD)
              - In-app folder and media explorer (MediaStore)
              - MLKit QR code camera scanner & direct Wi-Fi radar
              - Background transfer support & local notifications
            
            ### Artifacts:
            - `Zapdrop-v1.0-release.apk`
            
            ### SHA-256 Checksum:
            See attached `.sha256` file.
          files: |
            artifacts/Zapdrop-v1.0-release.apk
            artifacts/Zapdrop-v1.0-release.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
