name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        working-directory: ./android
        run: |
          chmod +x gradlew
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.keystore"
            ./gradlew assembleRelease --stacktrace \
              -PRELEASE_STORE_FILE="$RUNNER_TEMP/signing/release.keystore" \
              -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            echo "No signing keystore secret provided - building assembleDebug APK"
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Prepare Artifacts & Checksum
        run: |
          mkdir -p artifacts
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            TAG_NAME="${{ github.ref_name }}"
            [ -z "$TAG_NAME" ] && TAG_NAME="v2.0.1"
            cp "$APK_FILE" "artifacts/Zapdrop-${TAG_NAME}.apk"
            cd artifacts && sha256sum "Zapdrop-${TAG_NAME}.apk" > "Zapdrop-${TAG_NAME}.apk.sha256"
          else
            echo "Error: No APK generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapdrop-${{ github.ref_name || 'v2.0.1' }}-android-apk
          path: artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Zapdrop ${{ github.ref_name }} (Android 5.1+ / API 22+)"
          body: |
            ## Zapdrop ${{ github.ref_name }} Release (Android 5.1+ / API 22+)
            
            - **Platform**: Android 5.1+ (API Level 22 through API 34+)
            - **Engine**: Capacitor 6.2 + React + Vite + Tailwind CSS + NanoHTTPD
            - **Key Features**:
              - Direct device directory explorer (DCIM, Download, Documents, Pictures, etc.)
              - Embedded local HTTP file streaming server
              - QR code camera scanner & UDP radar peer discovery
              - Background transfer & notification support
            
            ### Artifacts:
            - `Zapdrop-${{ github.ref_name }}.apk`
          files: |
            artifacts/Zapdrop-*.apk
            artifacts/Zapdrop-*.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
