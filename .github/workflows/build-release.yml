name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Prepare fallback signing keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Artifacts & Checksum
        run: |
          mkdir -p artifacts
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "artifacts/Zapdrop-${GITHUB_REF_NAME}-release.apk"
            cd artifacts && sha256sum "Zapdrop-${GITHUB_REF_NAME}-release.apk" > "Zapdrop-${GITHUB_REF_NAME}-release.apk.sha256"
          else
            echo "Error: No APK generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapdrop-${{ github.ref_name }}-release-apk
          path: artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Zapdrop ${{ github.ref_name }} (Android 5.1+ / API 22+)"
          body: |
            ## Zapdrop ${{ github.ref_name }} Release (Android 5.1+ / API 22+)
            
            - **Platform**: Android 5.1+ (API Level 22 through API 34+)
            - **Engine**: Capacitor 6.2 + React + Vite + Tailwind CSS + NanoHTTPD
            - **Key Features**:
              - In-app MediaStore explorer (Photos, Videos, Audio, Docs, APKs)
              - Embedded local HTTP file streaming server
              - QR code camera scanner & UDP radar peer discovery
              - Background transfer & notification support
            
            ### Artifacts:
            - `Zapdrop-${{ github.ref_name }}-release.apk`
          files: |
            artifacts/Zapdrop-${{ github.ref_name }}-release.apk
            artifacts/Zapdrop-${{ github.ref_name }}-release.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
