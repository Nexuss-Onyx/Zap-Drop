name: Build & Release Linux Desktop

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Linux desktop bundles
        run: npm run tauri build

      - name: Prepare checksums
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cd artifacts
          sha256sum *.deb *.AppImage > SHA256SUMS 2>/dev/null || true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zapdrop-${{ github.ref_name || 'v2.0.1' }}-linux
          path: artifacts/*

      - name: Attach Linux packages to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Zapdrop ${{ github.ref_name }} (Linux Desktop)"
          body: |
            ## Zapdrop ${{ github.ref_name }} Linux Desktop

            ### How to Upgrade / Override Previous Linux Installation:

            #### Debian / Ubuntu / Mint / Pop!_OS (`.deb` Package):
            To override and upgrade an existing Zapdrop installation with this new release:
            ```bash
            wget https://github.com/Nexuss-Onyx/Zap-Drop/releases/download/${{ github.ref_name }}/Zapdrop_${{ github.ref_name || '2.0.1' }}_amd64.deb
            sudo apt install --reinstall ./Zapdrop_${{ github.ref_name || '2.0.1' }}_amd64.deb
            ```
            *(Or using dpkg: `sudo dpkg -i ./Zapdrop_*.deb`)*

            #### Portable AppImage (All Linux Distributions):
            To replace an existing AppImage with the new version:
            ```bash
            wget -O Zapdrop_${{ github.ref_name || '2.0.1' }}_amd64.AppImage https://github.com/Nexuss-Onyx/Zap-Drop/releases/download/${{ github.ref_name }}/Zapdrop_${{ github.ref_name || '2.0.1' }}_amd64.AppImage
            chmod +x Zapdrop_${{ github.ref_name || '2.0.1' }}_amd64.AppImage
            ./Zapdrop_${{ github.ref_name || '2.0.1' }}_amd64.AppImage
            ```
            To override any existing shortcut binary in `~/.local/bin`:
            ```bash
            mkdir -p ~/.local/bin
            mv Zapdrop_${{ github.ref_name || '2.0.1' }}_amd64.AppImage ~/.local/bin/zapdrop
            ```

            - Verify downloads with `SHA256SUMS`.
          files: |
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
